<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎯 Recommendations — Session 1 AI Training Course</title>
  <meta name="description" content="Editorial, pedagogical, audio, and distribution recommendations for the Sixth Form College AI Training Course." />
  <style>
    :root {
      --bg: #f8f8f7; --fg: #18181b; --muted: #64748b; --card: #ffffff;
      --line: #e2e8f0; --accent: #dc2626; --accent-dark: #991b1b; --code: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117; --fg: #f1f5f9; --muted: #94a3b8; --card: #181c26;
        --line: #293040; --accent: #ef4444; --accent-dark: #fca5a5; --code: #1f2533;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    header {
      border-bottom: 3px solid var(--accent);
      background: var(--card);
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 18px; }
    header .wrap { padding-top: 24px; padding-bottom: 20px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #ffffff;
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 999px;
    }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    nav a {
      color: var(--fg); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px;
    }
    nav a:hover { border-color: var(--accent); color: var(--accent); }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
    .pill b { color: var(--fg); font-weight: 600; }
    main { padding: 24px 0 72px; }
    #doc h1 { font-size: 30px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -.02em; }
    #doc h2 { margin-top: 42px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 22px; color: var(--accent-dark); }
    #doc h3 { margin-top: 24px; font-size: 18px; }
    #doc a { color: var(--accent); }
    #doc code { background: var(--code); padding: 1px 6px; border-radius: 4px; font-size: .9em; }
    #doc li { margin: 6px 0; }
    #doc table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card); margin: 16px 0; border-radius: 10px; overflow: hidden; }
    #doc th, #doc td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
    #doc th { background: var(--code); font-weight: 700; }
    .diagram-box {
      margin: 18px 0 24px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow-x: auto;
      text-align: center;
    }
    .diagram-box svg { max-width: 100%; height: auto; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <header>
    <div class="wrap">
      <div class="top-bar">
        <div class="eyebrow">🎯 Session 1 · AI Training Course Recommendations</div>
        <nav>
          <a href="index.html">📋 Edit Plan</a>
          <a href="improvements.html">✨ Improvements</a>
        </nav>
      </div>
      <div class="pills">
        <span class="pill">🤖 Course: <b>AI Training (Claude, ChatGPT, GitHub)</b></span>
        <span class="pill">🔴 Branding: <b>Red &amp; White Animated Titles</b></span>
        <span class="pill">🎙️ Audio: <b>Zoom H1n (-16 LUFS)</b></span>
      </div>
    </div>
  </header>
  <main class="wrap">
    <article id="doc">Loading recommendations…</article>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? "dark" : "default",
      securityLevel: "loose",
      flowchart: { curve: "basis", htmlLabels: true }
    });

    fetch("RECOMMENDATIONS.md", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(async md => {
        const el = document.getElementById("doc");
        el.innerHTML = marked.parse(md, { gfm: true });
        const blocks = el.querySelectorAll("pre > code.language-mermaid");
        blocks.forEach((codeEl, idx) => {
          const pre = codeEl.parentElement;
          const wrap = document.createElement("div");
          wrap.className = "diagram-box";
          const div = document.createElement("div");
          div.className = "mermaid";
          div.id = "mmd-" + idx;
          div.textContent = codeEl.textContent;
          wrap.appendChild(div);
          pre.replaceWith(wrap);
        });
        await mermaid.run({ querySelector: ".mermaid" });
      })
      .catch(e => {
        document.getElementById("doc").innerHTML =
          '<p class="err">Could not load RECOMMENDATIONS.md (' + e.message + '). Open <a href="RECOMMENDATIONS.md">RECOMMENDATIONS.md</a> directly.</p>';
      });
  </script>
</body>
</html>
