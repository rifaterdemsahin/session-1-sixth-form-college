<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⚡ Performance &amp; Timings — Session 1</title>
  <meta name="description" content="Measured pipeline performance, timings, and optimization insights for Session 1 video editing." />
  <style>
    :root {
      --bg: #f8f8f7; --fg: #18181b; --muted: #64748b; --card: #ffffff;
      --line: #e2e8f0; --accent: #dc2626; --accent-dark: #991b1b; --code: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117; --fg: #f1f5f9; --muted: #94a3b8; --card: #181c26;
        --line: #293040; --accent: #ef4444; --accent-dark: #fca5a5; --code: #1f2533;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 18px 72px; }
    #doc h1 { font-size: 30px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -.02em; }
    #doc h2 { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 22px; color: var(--accent-dark); }
    #doc a { color: var(--accent); }
    #doc code { background: var(--code); padding: 1px 6px; border-radius: 4px; font-size: .9em; }
    #doc table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card); margin: 16px 0; }
    #doc th, #doc td { border: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: top; }
    #doc th { background: var(--code); font-weight: 700; }
    .diagram-box {
      margin: 18px 0 24px; padding: 18px; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; text-align: center;
    }
    .diagram-box svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <main class="wrap">
    <article id="doc">Loading performance report…</article>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? "dark" : "default",
      securityLevel: "loose",
      flowchart: { curve: "basis", htmlLabels: true }
    });
    fetch("PERFORMANCE.md", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(async md => {
        const el = document.getElementById("doc");
        el.innerHTML = marked.parse(md, { gfm: true });
        el.querySelectorAll("pre > code.language-mermaid").forEach((codeEl, idx) => {
          const wrap = document.createElement("div");
          wrap.className = "diagram-box";
          const div = document.createElement("div");
          div.className = "mermaid";
          div.id = "mmd-" + idx;
          div.textContent = codeEl.textContent;
          wrap.appendChild(div);
          codeEl.parentElement.replaceWith(wrap);
        });
        await mermaid.run({ querySelector: ".mermaid" });
      });
  </script>
</body>
</html>
